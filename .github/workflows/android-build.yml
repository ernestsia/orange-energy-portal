name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeEnergy-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate Direct Download QR Code
        if: success()
        run: |
          # Construct direct download URL using nightly.link for public repo artifacts
          DOWNLOAD_URL="https://nightly.link/${{ github.repository }}/workflows/android-build/main/OrangeEnergy-App-Debug.zip"
          
          ENCODED_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$DOWNLOAD_URL'))")
          QR_IMAGE_URL="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${ENCODED_URL}"

          echo "## 📱 Scan to Install APK on Tecno Mobile" >> $GITHUB_STEP_SUMMARY
          echo "Scan this QR code with your phone camera to download **app-debug.apk** directly:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "![APK QR Code](${QR_IMAGE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Direct Zip Download Link](${DOWNLOAD_URL})" >> $GITHUB_STEP_SUMMARY