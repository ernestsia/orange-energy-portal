name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          yes | ./gradlew assembleDebug

      - name: Upload APK & Generate QR Code
        run: |
          RESPONSE=$(curl -s -F "file=@android/app/build/outputs/apk/debug/app-debug.apk" https://file.io)
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.link')

          echo "Download URL: $DOWNLOAD_URL"

          ENCODED_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$DOWNLOAD_URL'))")
          QR_IMAGE_URL="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${ENCODED_URL}"

          echo "## 📱 Scan to Install APK on Phone" >> $GITHUB_STEP_SUMMARY
          echo "Scan this QR code with your phone camera to download **app-debug.apk**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "![APK QR Code](${QR_IMAGE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Direct Download Link](${DOWNLOAD_URL})" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeEnergy-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk